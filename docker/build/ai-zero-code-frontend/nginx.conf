server {
    listen 80;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    client_max_body_size 35m;

    # 健康检查（/deploy skill 步骤 6）
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # SSE 流式代码生成
    location = /api/app/chat/code/gen {
        proxy_pass http://ai-zero-code-backend:7000/api/app/chat/code/gen;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://ai-zero-code-backend:7000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA + 部署产物（先查部署产物目录，不存在回退到 SPA）
    location / {
        root /opt/app/ai-zero-code/tmp/deploy;
        try_files $uri @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Nginx 状态（nginx-exporter 抓取）
    location = /nginx_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }
}
