services:
  mysql:
    image: mysql:8.0
    container_name: ai-zero-code-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: ai_zero_code
      MYSQL_USER: admin
      MYSQL_PASSWORD: "123"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ai-zero-code-mysql-data:/var/lib/mysql
    networks:
      - ai-zero-code-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00

  redis:
    image: redis/redis-stack-server:7.2.0-v12
    container_name: ai-zero-code-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --requirepass 123"
    ports:
      - "6379:6379"
    volumes:
      - ai-zero-code-redis-data:/data
    networks:
      - ai-zero-code-net

  nginx:
    image: nginx:stable-alpine
    container_name: ai-zero-code-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../tmp/deploy:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai-zero-code-net

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-zero-code-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ai-zero-code-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - ai-zero-code-net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: ai-zero-code-mysqld-exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    volumes:
      - ./prometheus/mysqld-exporter.cnf:/cfg/.my.cnf:ro
    ports:
      - "9104:9104"
    networks:
      - ai-zero-code-net
    depends_on:
      - mysql

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ai-zero-code-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "123"
    ports:
      - "9121:9121"
    networks:
      - ai-zero-code-net
    depends_on:
      - redis

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: ai-zero-code-nginx-exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx:80/nginx_status"
    ports:
      - "9113:9113"
    networks:
      - ai-zero-code-net
    depends_on:
      - nginx

  grafana:
    image: grafana/grafana:latest
    container_name: ai-zero-code-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ai-zero-code-grafana-data:/var/lib/grafana
    networks:
      - ai-zero-code-net
    depends_on:
      - prometheus

networks:
  ai-zero-code-net:
    driver: bridge

volumes:
  ai-zero-code-mysql-data:
  ai-zero-code-redis-data:
  ai-zero-code-prometheus-data:
  ai-zero-code-grafana-data:
