# Prometheus 配置文件（本地开发）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:

rule_files:

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ai-zero-code'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7000']
    scrape_interval: 10s
    scrape_timeout: 10s

  - job_name: "mysql"
    static_configs:
      - targets: ["ai-zero-code-mysqld-exporter:9104"]

  - job_name: "redis"
    static_configs:
      - targets: ["ai-zero-code-redis-exporter:9121"]

  - job_name: "nginx"
    static_configs:
      - targets: ["ai-zero-code-nginx-exporter:9113"]
