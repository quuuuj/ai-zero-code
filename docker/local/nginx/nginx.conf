server {
    listen       80;
    server_name  localhost;

    charset      utf-8;
    charset_types text/css application/javascript text/plain text/xml application/json;

    # 项目部署根目录（容器内路径，通过 volume 挂载 ../tmp/deploy）
    root /usr/share/nginx/html;

    # 处理 /{deployKey}/{file} 精确文件请求（至少两段路径）
    location ~ ^/([^/]+)/(.+)$ {
        try_files /$1/$2 =404;
    }

    # /{deployKey}（无尾斜杠）→ 301 重定向，确保浏览器相对路径正确
    location ~ ^/([^/]+)$ {
        return 301 /$1/;
    }

    # /{deployKey}/（带尾斜杠）→ 返回 index.html
    location ~ ^/([^/]+)/$ {
        try_files /$1/index.html =404;
    }

    # Nginx 状态页，供 Prometheus nginx-exporter 抓取
    location = /nginx_status {
        stub_status;
        allow 172.16.0.0/12;   # Docker 内部网络
        allow 127.0.0.1;
        deny all;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
