spring:
  application:
    name: ai-zero-code
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/ai_zero_code?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      username: "default"
      password: "123456"
      ttl: 3600
  jackson:
    time-zone: Asia/Shanghai
  # session 配置
  session:
    store-type: redis
    # session 3 天过期
    timeout: 259200

server:
  port: 7000
  servlet:
    context-path: /api
    # cookie 3 天过期
    session:
      cookie:
        max-age: 259200

springdoc:
  group-configs:
    - group: "default"
      packages-to-scan: "com.qiujie.aizerocode.controller"

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.qiujie.aizerocode.mapper: DEBUG

# AI 代码生成 - DeepSeek
langchain4j:
  open-ai:
    chat-model: # 结构化输出
      base-url: https://api.deepseek.com
      api-key: ${API_KEY}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-tokens: 32768
      reasoning-effort: "low"
    #      strict-json-schema: true
    #      response-format: json_object
    streaming-chat-model: # 流式输出
      base-url: https://api.deepseek.com
      api-key: ${API_KEY}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-tokens: 32768
      reasoning-effort: "low"
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${API_KEY}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-tokens: 65536
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${API_KEY}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-tokens: 256
      reasoning-effort: "low"
      temperature: 0

# 阿里云 OSS 对象存储
oss:
  client:
    endpoint: ${ENDPOINT}
    access-key-id: ${ACCESS_KEY_ID}
    access-key-secret: ${ACCESS_KEY_SECRET}
    bucket-name: ${BUCKET_NAME}

pexels:
  api-key: ${PEXELS_API_KEY}

dashscope:
  api-key: ${DASH_SCOPE_API_KEY}
  img-model: wanx-v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# 应用部署域名：用于生成部署后的访问地址（生产环境通过环境变量 APP_DEPLOY_HOST 覆盖为部署域名）
app:
  deploy-host: localhost

